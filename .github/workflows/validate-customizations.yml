name: Validate Copilot customizations

on:
  pull_request:
    paths:
      - ".github/**"
      - ".vscode/mcp*.json"
      - ".mcp.json"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "README.md"
  push:
    paths:
      - ".github/**"
      - ".vscode/mcp*.json"
      - ".mcp.json"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_customizations.py
      - run: python -m unittest discover -s tests -q
